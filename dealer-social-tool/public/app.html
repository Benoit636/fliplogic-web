<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dealer Social</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚗</text></svg>" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar" id="sidebar">
        <div class="brand">
          <span class="brand-mark">DS</span>
          <div>
            <div class="brand-name">Dealer Social</div>
            <div class="brand-sub" id="dealer-name">Loading…</div>
          </div>
        </div>
        <nav id="nav">
          <a href="#/dashboard" data-view="dashboard">📊 Dashboard</a>
          <a href="#/assistant" data-view="assistant">🤖 AI Assistant</a>
          <a href="#/studio" data-view="studio">✍️ Content Studio</a>
          <a href="#/approvals" data-view="approvals">✅ Approvals <span class="count" id="count-approvals"></span></a>
          <a href="#/calendar" data-view="calendar">📅 Calendar</a>
          <a href="#/posts" data-view="posts">🗂️ All Posts</a>
          <a href="#/inbox" data-view="inbox">💬 Inbox <span class="count" id="count-inbox"></span></a>
          <a href="#/inventory" data-view="inventory">🚙 Inventory</a>
          <a href="#/autopilot" data-view="autopilot">⚙️ Autopilot</a>
          <a href="#/analytics" data-view="analytics">📈 Analytics</a>
          <a href="#/settings" data-view="settings">🏢 Settings</a>
          <a href="#/team" data-view="team">👥 Team</a>
          <a href="#/billing" data-view="billing">💳 Billing</a>
        </nav>
        <div class="ai-status" id="ai-status"></div>
        <div class="user-box" id="user-box"></div>
      </aside>
      <main>
        <header class="topbar">
          <button class="icon-btn menu-btn" id="menu-btn" aria-label="Menu">☰</button>
          <h1 id="view-title">Dashboard</h1>
          <div class="topbar-right" id="mode-badge"></div>
        </header>
        <section class="view" style="padding-bottom:0" id="banner-root"></section>
        <section id="view" class="view"></section>
      </main>
    </div>
    <div id="modal-root"></div>
    <div id="toast-root"></div>
    <script type="module" src="app.js"></script>
  </body>
</html>
